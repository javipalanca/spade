name: PyPy publish on tag

on:
  push:
    tags:
      - '*[0-9]-beta*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      -  name: Build the package
         run: |
           uv build

      - name: Smoke Test
        run: |
            uv run --isolated --no-project --with dist/*.whl pytest --ignore=tests/test_e2e.py

      -  name: Publish the package to PyPI
         env:
           UV_PUBLISH_TOKEN: ${{ secrets.DEPLOY_PAT }}
         run: |
           uv publish
