name: Build and Deploy Docs

on:
  push:
    branches: ["master", "develop"]
    paths:
      - "docs/**"
      - "spade/**"
      - "readthedocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "docs/**"
      - "spade/**"
      - "readthedocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOCS_DESTINATION_DIR: ${{ github.ref == 'refs/heads/develop' && 'docs/spade/develop' || 'docs/spade' }}
      SPADE_DOCS_CHANNEL: ${{ github.ref == 'refs/heads/develop' && 'develop' || 'stable' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build Sphinx docs
        run: |
          rm -f docs/spade.rst docs/modules.rst
          uv run sphinx-apidoc -o docs/ spade
          uv run sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Deploy to gh-pages branch
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/_build/html
          destination_dir: ${{ env.DOCS_DESTINATION_DIR }}
          keep_files: true
          enable_jekyll: false
