[tox]
envlist = docs, py39, py310, py311, py312, lint
isolated_build = false

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
allowlist_externals =
    uv
    sh
    cmd
    pytest
skip_install = true
commands_pre =
    posix: sh -c "uv pip install -e .[dev] || pip install -e .[dev]"
    win32: cmd /c "uv pip install -e .[dev] || pip install -e .[dev]"
commands =
    pytest --basetemp={envtmpdir} --cov=spade

[testenv:lint]
commands =
    ruff check spade
    ruff format --check spade

[testenv:docs]
changedir=docs
setenv =
    LC_ALL=en_US.UTF-8
    LANG=en_US.UTF-8
commands=
    sphinx-build -b html -d {envtmpdir}/doctrees . {envtmpdir}/html
