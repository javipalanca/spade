[tool.bumpversion]
current_version = "4.1.4"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = [
    "{major}.{minor}.{patch}{release}{rc}",
    "{major}.{minor}.{patch}"
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = true

[[tool.bumpversion.files]]
filename = "spade/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "spade/templates/internal_tpl_base.html"
search = "<b>Version</b> {current_version}"
replace = "<b>Version</b> {new_version}"

[[tool.bumpversion.files]]
filename = "docs/usage.rst"
search = "Version: {current_version}"
replace = "Version: {new_version}"

[tool.bumpversion.parts.release]
optional_value = "placeholder"
values = [
    "rc",
    "placeholder"
]

[tool.bumpversion.parts.rc]
first_value = 1
