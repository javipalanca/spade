[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel"
    ]
build-backend = "setuptools.build_meta"

[project]
name = "spade"
dynamic = ["version", "dependencies"]
description = "Smart Python Agent Development Environment"
authors = [{ name = "Javi Palanca", email = "jpalanca@gmail.com" }]
maintainers = [{ name = "Javi Palanca", email = "jpalanca@gmail.com" }]
license = "MIT"
readme = "README.rst"
keywords = ["spade"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: XMPP"
]

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "setuptools==80.9.0",
    "bump2version==1.0.1",
    "wheel==0.45.1",
    "watchdog==2.1.9",
    "ruff==0.3.3",
    "tox==4.23.2",
    "coverage==7.2.1",
    "Sphinx==5.1.0",
    "twine==6.1.0",
    "pyyaml==6.0.2",
    "pytest==8.3.4",
    "pytest-runner==5.3.2",
    "pytest-asyncio==0.24.0",
    "pytest-cov==3.0.0",
    "pytest-mock==3.6.1",
    "python-coveralls==2.9.3",
    "requests==2.32.3",
    "parsel==1.9.1",
    "sphinx_rtd_theme==1.0.0",
    "testfixtures==7.0.0",
    "pytest-aiohttp==1.0.4",
    "factory-boy==3.2.1",
    "click==8.1.7",
]

[project.urls]
Homepage = "https://spadeagents.eu"
Repository = "https://github.com/javipalanca/spade"
Documentation = "http://spade-mas.readthedocs.io/"

[project.scripts]
spade = "spade.cli:cli"

[tool.setuptools]
packages = ["spade"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "spade.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
spade = ["templates/*"]

[tool.ruff]
lint.select = ["E", "F"]
lint.ignore = ["E501"]
line-length = 88
target-version = "py38"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["spade"]